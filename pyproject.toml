[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bathagent"
version = "0.1.0"
description = "BathAgent - BathStuff Operations AI Assistant combining Google ADK with MCP Toolbox for Databases and Wildfire Proxy"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Andrew Brook", email = "andybrook@google.com" }
]
dependencies = [
    "google-genai>=1.0.0",
    "streamlit>=1.35.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "rich>=13.7.1",
    "tabulate>=0.9.0"
]

[project.scripts]
bathagent-cli = "bathagent.cli:main"
bathagent-init-db = "bathagent.database.init_db:init_database"
